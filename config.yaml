# 주간 회계·감사 인사이트 파이프라인 설정
# 비밀값(메일 비밀번호, API 키)은 절대 이 파일에 넣지 말고 .env 또는 GitHub Secrets 에 넣으세요.

timezone: Asia/Seoul
lookback_days: 7          # 매주 수집 범위 (월요일 실행 시 직전 월~일)
baseline_days: 30         # 최초 실행 시 '기준 게시물'로 함께 보여줄 범위

# 출력 폴더: 환경변수 OUTPUT_DIR 가 있으면 그 값을 우선 사용합니다.
output_dir: "~/Documents/CPA_Weekly_Briefing"
# Windows 파일명에는 '/' 를 쓸 수 없어 '·' 로 대체했습니다.
filename_pattern: "{date}_주간회계·감사브리핑.pdf"

keywords:
  # 섹션 1 (금감원/금융위) 필터 키워드
  regulator: [회계, 감사, 감리, 외부감사, 회계기준, 내부회계관리제도, 내부회계, 공인회계사, 회계법인, 감사인, 감사위원회, 재무제표, 회계부정, 분식]
  # 섹션 2·3 관련도 판단: 핵심 키워드 (제목에 있으면 채택, 본문에 여러 개면 채택)
  core: [회계, 감사, 감리, 외부감사, 내부회계, 내부통제, IFRS, 회계기준, 기준서, 거버넌스, 감사위원회, 재무보고, 품질관리, 회계투명성, 감사인, 공인회계사, 회계사, 회계법인, 지속가능성 공시, 공시기준]
  # AI 키워드: 제목에 있고 본문에 핵심 키워드가 있으면 'AI 감사·내부통제 트렌드'로 채택
  ai: [AI, 인공지능, 생성형, GenAI, 에이전트]
  # 오탐 제거 (예: '감사합니다', '국정감사')
  exclude: [감사합니다, 감사드립니다, 국정감사, 감사원장]

# 중요도 가중치 (제목에 나오면 x2)
weights:
  감리: 3
  외부감사: 3
  내부회계관리제도: 3
  내부회계: 2
  회계기준: 3
  IFRS: 2
  감사인: 2
  품질관리: 2
  회계부정: 3
  분식: 3
  감사위원회: 2
  지정감사: 3
  회계투명성: 2
  AI: 1
  인공지능: 1
  내부통제: 2
  회계: 1
  감사: 1

limits:
  section1: 15
  section2: 12
  section3_per_firm: 4
  google_news_per_query: 3

llm:
  model: claude-opus-5-5
  effort: medium
  chunk_size: 18
